name: Deploy

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ vars.IP }}
          username: ${{ vars.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/ubuntu/GeoTasker
            git fetch origin
            git checkout main
            git reset --hard origin/main
            npm ci
            npm run build
            npx pm2 startOrRestart ecosystem.config.cjs --env production
